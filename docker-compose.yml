services:
  postgres:
    image: postgres:16-alpine
    container_name: etl-agent-postgres
    environment:
      POSTGRES_USER: etl_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: etl_agent
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_agent -d etl_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: etl-agent-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - control
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: etl-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: testdb
      MYSQL_USER: ${MYSQL_USER:-testuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testpass}
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-plane
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -utestuser -ptestpass --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  doris:
    image: apache/doris:2.1.0-fe
    container_name: etl-agent-doris-fe
    environment:
      FE_SERVERS: "fe1:172.19.0.10:9010"
      FE_ID: "1"
    ports:
      - "8030:8030"   # FE HTTP (Web UI + REST API)
      - "19030:9030"  # FE query port (MySQL protocol)
      - "9010:9010"   # FE edit log
    volumes:
      - dorisfedata:/opt/apache-doris/fe/doris-meta
      - dorisfelogs:/opt/apache-doris/fe/log
    networks:
      data-plane:
        ipv4_address: 172.19.0.10
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  doris-be:
    image: apache/doris:2.1.0-be
    container_name: etl-agent-doris-be
    environment:
      FE_SERVERS: "fe1:172.19.0.10:9010"
      BE_ADDR: "172.19.0.11:9050"
    ports:
      - "19040:8040"   # BE HTTP (REST API)
      - "19050:9050"  # BE heartbeat
      - "19060:9060"  # BE Thrift
    volumes:
      - dorisbedata:/opt/apache-doris/be/storage
      - dorisbelogs:/opt/apache-doris/be/log
    depends_on:
      doris:
        condition: service_healthy
    networks:
      data-plane:
        ipv4_address: 172.19.0.11
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8040/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  seatunnel:
    image: docker.m.daocloud.io/apache/seatunnel:2.3.8
    container_name: etl-agent-seatunnel
    ports:
      - "5801:5801"
    environment:
      SEATUNNEL_HOME: /opt/seatunnel
      ST_DOCKER_MEMBER_COUNT: "1"
    command: ["/opt/seatunnel/bin/seatunnel-cluster.sh"]
    restart: unless-stopped
    networks:
      - control
      - data-plane
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5801/hazelcast/rest/maps/running-jobs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  vault:
    image: hashicorp/vault:1.18
    container_name: etl-agent-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  # Control plane: API server, PG, Redis, Vault, SeaTunnel
  control:
    driver: bridge
  # Data plane: MySQL, Doris, SeaTunnel (source/target data sources)
  data-plane:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  pgdata:
  redisdata:
  mysqldata:
  dorisfedata:
  dorisfelogs:
  dorisbedata:
  dorisbelogs:
